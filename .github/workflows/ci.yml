name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No `npm ci` on purpose: the extension and every test harness are
      # dependency-free, so there is nothing to install and no lockfile to
      # drift. If this ever needs an install step, that is a design change.

      # 190 assertions, pure Node — no browser required.
      - name: Unit tests
        run: npm test

      # 58 assertions, pure Node: the realtime caption fallback. Pins both
      # directions — a VOD whose whole-track fetch failed must be handled, and a
      # video with no captions at all must NOT be, or a clear error would turn
      # into a permanent blank.
      - name: Realtime fallback tests
        run: npm run test:live

      # 168 assertions against real headless Chrome (the runner image ships
      # google-chrome at /usr/bin/google-chrome, which scripts/lib/chrome.mjs
      # finds on its own). Set CHROME_PATH to point at another binary.
      - name: DOM tests
        run: npm run test:dom

      # 185 assertions: popup panel switching, the 600px popup height budget,
      # settings-page interactions, custom-provider validation, and the
      # diagnostics verdicts (including the two `status: 'empty'` causes, which
      # must not be described with the same sentence).
      - name: Page probes
        run: npm run test:pages

      # Documentation drift guard. The figures quoted above are claims like any
      # other, and they went stale silently twice. This measures `src/` directly,
      # cross-checks README.md, README.zh-CN.md and this file against each other,
      # reads every suite's own EXPECTED_ASSERTIONS pin, and re-runs the two
      # browser-free suites to confirm their quoted counts are real. Reading the
      # pins is what makes the two Chrome-backed figures verifiable here at all —
      # before, a wrong count for `test:pages` was simply never checked, and one
      # did go stale unnoticed. Deliberately does not start a line with a number
      # followed by "assertions" — the guard reads exactly those lines.
      - name: Documentation drift
        run: npm run check:docs

      # Release-facing images have exact size and channel requirements, and a
      # regeneration on a different machine can silently violate them. Check the
      # committed bytes before a human ever gets to the store upload form.
      - name: Release assets
        run: npm run check:assets

      # NOT run here, on purpose:
      #   npm run test:e2e  — loads the unpacked extension into a real Chrome
      #                       profile over CDP: slow and environment-sensitive.
      #   npm run smoke     — hits real YouTube. Its result depends on the
      #                       profile (a signed-out throwaway one never gets a
      #                       PoToken), so a red run here would mean nothing.
      # Run both locally before a release.
