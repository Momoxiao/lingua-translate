name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No `npm ci` on purpose: the extension and every test harness are
      # dependency-free, so there is nothing to install and no lockfile to
      # drift. If this ever needs an install step, that is a design change.

      # 157 assertions, pure Node — no browser required.
      - name: Unit tests
        run: npm test

      # 164 assertions against real headless Chrome (the runner image ships
      # google-chrome at /usr/bin/google-chrome, which scripts/lib/chrome.mjs
      # finds on its own). Set CHROME_PATH to point at another binary.
      - name: DOM tests
        run: npm run test:dom

      # 72 assertions: popup panel switching, the 600px popup height budget,
      # settings-page interactions, custom-provider validation, and the
      # diagnostics verdicts (including the two `status: 'empty'` causes, which
      # must not be described with the same sentence).
      - name: Page probes
        run: npm run test:pages

      # NOT run here, on purpose:
      #   npm run test:e2e  — loads the unpacked extension into a real Chrome
      #                       profile over CDP: slow and environment-sensitive.
      #   npm run smoke     — hits real YouTube. Its result depends on the
      #                       profile (a signed-out throwaway one never gets a
      #                       PoToken), so a red run here would mean nothing.
      # Run both locally before a release.
