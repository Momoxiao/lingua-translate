<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Lingua</title>
    <link rel="stylesheet" href="../ui/theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="pop">
      <header class="pop__head">
        <div class="brand">
          <div class="brand__mark" aria-hidden="true"></div>
          <div>
            <div class="brand__name">Lingua</div>
            <div class="brand__sub" id="modeLabel">翻译</div>
          </div>
        </div>
        <span class="pill" id="statusPill" data-tone="idle">
          <span class="pill__dot"></span>
          <span id="statusText">读取中</span>
        </span>
      </header>

      <!--
        One panel is chosen by context, so there is normally nothing to switch
        between. A YouTube video page is the exception: the video has captions
        AND the page around it (description, comments) has prose worth
        translating, so both apply and the switcher appears. Anywhere else it
        stays hidden rather than offering a dead end.
      -->
      <div class="tabs" id="tabs" role="tablist" hidden>
        <button type="button" role="tab" data-tab="video" aria-selected="false">视频字幕</button>
        <button type="button" role="tab" data-tab="page" aria-selected="false">网页翻译</button>
      </div>

      <!-- ================= 视频字幕（仅 YouTube 视频页） ================= -->
      <section class="panel" id="panel-video" data-panel="video" hidden>
        <label class="pop__switchRow">
          <span class="pop__switchText">
            <span class="pop__switchTitle">翻译视频字幕</span>
            <span class="hint" id="providerName">—</span>
          </span>
          <span class="switch">
            <input type="checkbox" id="enabled" />
            <span class="switch__track"></span>
          </span>
        </label>

        <div class="field">
          <label class="label" for="target">翻译为</label>
          <select id="target"></select>
        </div>

        <div class="field">
          <span class="label">字幕显示方式</span>
          <div class="segmented segmented--block" id="displayMode" role="group" aria-label="字幕显示方式">
            <button type="button" data-mode="bilingual" aria-pressed="false">双语</button>
            <button type="button" data-mode="translated" aria-pressed="false">仅译文</button>
            <button type="button" data-mode="original" aria-pressed="false">仅原文</button>
          </div>
        </div>

        <div class="field" id="trackField" hidden>
          <label class="label" for="track">字幕来源</label>
          <select id="track"></select>
        </div>

        <div class="progressBox" id="progressBox" hidden>
          <div class="progressBox__top">
            <span class="progressBox__label" id="progressLabel">翻译中</span>
            <span class="progressBox__num" id="progressNum">0 / 0</span>
          </div>
          <div class="progress"><div class="progress__bar" id="progressBar"></div></div>
        </div>

        <div class="note" id="note" hidden></div>

        <button class="btn btn--block" id="retranslate" type="button">重新翻译</button>
      </section>

      <!-- ================= 网页翻译（其他所有页面） ================= -->
      <section class="panel" id="panel-page" data-panel="page" hidden>
        <!-- state card: mirrors the floating ball exactly -->
        <div class="stateCard" id="pageStateCard" data-tone="idle">
          <div class="stateCard__body">
            <div class="stateCard__title" id="pageStateTitle">未翻译</div>
            <div class="stateCard__sub">
              <span id="pageHost">—</span>
              <!-- which "expert" got this page — part of "what is happening
                   here", so it lives on the card rather than on its own row -->
              <span class="stateCard__style" id="pageProfileValue"></span>
            </div>
          </div>
          <button class="btn btn--primary" id="pageToggle" type="button">开始翻译</button>
          <div class="stateCard__strip" id="pageProgressBox" hidden>
            <div class="progress"><div class="progress__bar" id="pageProgressBar"></div></div>
          </div>
        </div>

        <div class="note" id="pageNote" hidden></div>

        <div class="pop__group">
          <div class="pop__groupTitle">显示</div>
          <div class="grid2">
            <div class="field">
              <label class="label" for="pageMode">显示方式</label>
              <select id="pageMode">
                <option value="bilingual">双语</option>
                <option value="replace">仅译文</option>
              </select>
            </div>
            <div class="field">
              <label class="label" for="pageStyle">译文样式</label>
              <select id="pageStyle">
                <option value="underline">左侧标记</option>
                <option value="plain">纯文本</option>
                <option value="highlight">底色高亮</option>
              </select>
            </div>
          </div>
          <label class="pop__switchRow pop__switchRow--tight">
            <span class="pop__switchText">
              <!-- "只显示原文" read as a synonym of the video panel's 仅原文
                   display mode, but the two behave differently: this one is a
                   temporary toggle, that one is a persistent mode. Naming this
                   by what it does removes the collision — and on a YouTube
                   video page both panels are one click apart. -->
              <span class="pop__switchTitle">暂时收起译文</span>
              <span class="hint">译文不会丢，随时可以恢复</span>
            </span>
            <span class="switch">
              <input type="checkbox" id="pageShowOriginal" />
              <span class="switch__track"></span>
            </span>
          </label>
        </div>

        <div class="pop__group">
          <div class="pop__groupTitle">本站</div>
          <div class="field">
            <label class="label" for="siteRule">打开本页时</label>
            <select id="siteRule">
              <option value="manual">手动翻译</option>
              <option value="auto">自动翻译</option>
              <option value="skip">不翻译</option>
            </select>
          </div>
          <label class="pop__switchRow pop__switchRow--tight">
            <span class="pop__switchText">
              <span class="pop__switchTitle">页面悬浮球</span>
              <span class="hint">贴边隐藏，点一下即翻译</span>
            </span>
            <span class="switch">
              <input type="checkbox" id="pageBall" />
              <span class="switch__track"></span>
            </span>
          </label>
        </div>

        <button class="btn btn--block" id="pageRetranslate" type="button">重新翻译</button>
      </section>

      <footer class="pop__foot">
        <span class="pop__footHint" id="footHint"></span>
        <!-- Grouped: with three children, the footer's space-between would push
             the two buttons apart instead of keeping them together. -->
        <div class="pop__footActions">
          <button class="btn btn--ghost btn--sm" id="openDiagnostics" type="button">诊断</button>
          <button class="btn btn--ghost btn--sm" id="openOptions" type="button">设置</button>
        </div>
      </footer>
    </div>

    <script src="../shared/constants.js"></script>
    <script src="../shared/utils.js"></script>
    <script src="../shared/settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
